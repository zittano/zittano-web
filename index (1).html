<style>
:root{
  --noche:#1A1F3A; --noche2:#252B4D; --perg:#F2EBD9; --perg2:#FAF6EC; --bronce:#C9A84C; --bronce-d:#8A6F22;
  --vino:#8B1A1A; --oliva:#2D5A4E; --oliva-soft:#E1ECE5; --pizarra:#4A4560; --line:#E3D9C0;
  --wa:#1F7A4A; --wa-d:#155C37;
  --shadow:0 1px 2px rgba(26,31,58,.06),0 10px 30px rgba(26,31,58,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--perg);color:var(--noche);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.tricolor{display:flex;height:5px}.tricolor i{flex:1}.tricolor i:nth-child(1){background:#1F7A4A}.tricolor i:nth-child(2){background:#fff}.tricolor i:nth-child(3){background:var(--vino)}
.wrap{max-width:520px;margin:0 auto;min-height:calc(100vh - 5px);display:flex;flex-direction:column;padding:16px 20px 28px}
.serif{font-family:'Playfair Display',Georgia,serif}
.hidden{display:none!important}
header{display:grid;grid-template-columns:96px 1fr 96px;align-items:center;min-height:48px}
header img{justify-self:center;display:block;height:auto}
.back{background:none;border:none;font:inherit;font-size:14px;font-weight:600;color:var(--pizarra);display:flex;align-items:center;gap:4px;cursor:pointer;padding:10px 4px;min-height:44px}
.back.off{visibility:hidden}
.progress{height:4px;border-radius:999px;background:var(--line);overflow:hidden;margin:12px 0 0}
.progress>div{height:100%;background:linear-gradient(90deg,var(--bronce),var(--vino));border-radius:999px;transition:width .4s ease}
.screen{display:flex;flex-direction:column;flex:1;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1,h2{margin:0}h1:focus,h2:focus{outline:none}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--bronce-d)}
.lead{margin:0;font-size:16px;line-height:24px;color:var(--pizarra)}
.help{margin:0;font-size:14px;line-height:20px;color:var(--pizarra)}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1;min-height:20px}

/* Intro */
.hero{background:var(--noche);color:var(--perg);border-radius:26px;padding:28px 22px 24px;margin-top:14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(201,168,76,.35)}
.hero::before{content:"";position:absolute;right:-10px;top:-10px;width:120px;height:120px;border-radius:50%;border:1px solid rgba(201,168,76,.22)}
.hero .eyebrow{color:var(--bronce)}
.hero h1{font-size:44px;line-height:46px;font-weight:800;margin-top:10px}
.hero h1 em{font-style:italic;color:var(--bronce);font-weight:600}
.hero p{margin:14px 0 0;font-size:16px;line-height:24px;color:#D8D3C4}
.rule{display:flex;align-items:center;gap:10px;margin:18px 0 0;color:var(--bronce)}
.rule i{flex:1;height:1px;background:rgba(201,168,76,.5)}
.gift{display:flex;gap:14px;align-items:center;background:var(--perg2);border:1.5px dashed var(--bronce);border-radius:20px;padding:16px;margin-top:14px}
.gift .gi{width:46px;height:46px;border-radius:14px;background:var(--noche);color:var(--bronce);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gift b{display:block;font-size:15px}
.gift span{font-size:13px;color:var(--pizarra);line-height:18px}

/* Opciones */
h2{font-size:28px;line-height:33px;font-weight:800}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:14px 16px;background:var(--perg2);border:1.5px solid var(--line);border-radius:18px;font:inherit;font-size:16px;font-weight:500;color:var(--noche);text-align:left;cursor:pointer;transition:transform .12s,border-color .15s,background .15s}
.opt:hover{border-color:var(--bronce)}
.opt:active{transform:scale(.98)}
.opt[aria-pressed=true]{border-color:var(--noche);background:#fff}
.opt .em{font-size:24px;width:40px;height:40px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.opt .sub{font-size:13px;color:var(--pizarra);font-weight:400}
.opt .chk{width:22px;height:22px;border-radius:7px;border:2px solid #CDBF9A;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.opt[aria-pressed=true] .chk{background:var(--noche);border-color:var(--noche)}
.tag{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.5px;padding:6px 12px;border-radius:999px;background:var(--noche);color:var(--bronce)}
.tag.serio{background:var(--vino);color:#fff}

/* Regiones (grilla) */
.opts.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.grid .opt{min-height:52px;padding:10px 12px;font-size:15px;gap:10px;border-radius:14px}
.opts.grid .opt .em{width:30px;height:30px;font-size:18px;border-radius:9px}
/* Campo de texto */
.field{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.field label{font-size:14px;font-weight:600;color:var(--pizarra)}
.field input{height:58px;border:1.5px solid var(--line);border-radius:16px;padding:0 18px;font:inherit;font-size:20px;background:var(--perg2);color:var(--noche)}
.field input:focus{outline:3px solid var(--bronce);outline-offset:1px;border-color:var(--bronce)}
/* Historia */
.historia{background:var(--perg2);border-radius:24px;padding:22px 20px;border:1px solid var(--line);position:relative;overflow:hidden}
.historia::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(#1F7A4A 0 33%,#fff 33% 66%,var(--vino) 66%)}
.historia .eyebrow{color:var(--bronce-d)}
.historia p{margin:10px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:20px;line-height:29px;color:var(--noche)}
.historia p.small{font-family:'Inter',sans-serif;font-size:15px;line-height:22px;color:var(--pizarra)}
.historia .vuelta{margin-top:14px;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;font-size:22px;color:var(--vino)}
.words{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.words span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
.words span b{color:var(--vino)}
/* Botones */
.btn{min-height:56px;border-radius:16px;border:none;font:inherit;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;cursor:pointer;width:100%;padding:0 18px;text-align:center}
.btn.main{background:var(--noche);color:var(--perg)}.btn.main:hover{background:var(--noche2)}
.btn.wa{background:var(--wa);color:#fff}.btn.wa:hover{background:var(--wa-d)}
.btn.gold{background:var(--bronce);color:var(--noche)}
.btn.ghost{background:transparent;border:1.5px solid #CDBF9A;color:var(--noche);min-height:50px;font-size:15px}
.btn.link{background:none;min-height:44px;font-size:15px;color:var(--pizarra);font-weight:600}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.back:focus-visible{outline:3px solid var(--bronce);outline-offset:2px}

/* Interludio */
.inter{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:left}
.inter .big{font-size:40px;line-height:44px;font-weight:800}

/* Resultado */
.meter{background:var(--noche);color:var(--perg);border-radius:26px;padding:24px 20px 22px;margin-top:14px;text-align:center;box-shadow:var(--shadow)}
.meter .eyebrow{color:var(--bronce)}
.dial{position:relative;width:240px;height:132px;margin:14px auto 0}
.dial svg{display:block}
.dial .pct{position:absolute;left:0;right:0;bottom:-4px;font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:56px;line-height:1;color:var(--perg)}
.dial .pct small{font-size:28px;color:var(--bronce)}
.meter h2{font-size:30px;line-height:34px;margin-top:14px;color:var(--perg)}
.meter h2 em{color:var(--bronce);font-style:italic;font-weight:600}
.meter p{margin:8px 0 0;font-size:15px;line-height:22px;color:#D8D3C4}
.card{background:var(--perg2);border-radius:24px;padding:20px;border:1px solid var(--line)}
.card h3{margin:6px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:23px;line-height:28px;font-weight:800}
.card p{margin:8px 0 0;font-size:15px;line-height:22px;color:var(--pizarra)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px}
.pill.ok{background:var(--oliva-soft);color:var(--oliva)}
.pill.mid{background:#F6E7C4;color:#6B4E00}
.pill.info{background:#E3E5EF;color:var(--noche)}
.points{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.points li{display:flex;gap:10px;font-size:15px;line-height:21px}
.points li svg{flex-shrink:0;margin-top:2px;color:var(--oliva)}
.prize{background:var(--noche);color:var(--perg);border-radius:24px;padding:20px;position:relative;overflow:hidden}
.prize .eyebrow{color:var(--bronce)}
.prize h3{margin:8px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:25px;line-height:30px;font-weight:800}
.prize p{margin:8px 0 0;font-size:14px;line-height:20px;color:#D8D3C4}
.code{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;background:rgba(201,168,76,.12);border:1.5px dashed var(--bronce);border-radius:14px;padding:12px 14px}
.code b{font-family:'Inter',monospace;letter-spacing:2px;font-size:20px;color:var(--bronce)}
.code span{font-size:12px;color:#D8D3C4}
.sorteo{background:var(--perg2);border:1.5px solid var(--bronce);border-radius:24px;padding:20px}
.sorteo h3{margin:6px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:22px;line-height:27px;font-weight:800}
.steps{margin:12px 0 0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:flex;gap:10px;font-size:15px;line-height:21px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--noche);color:var(--bronce);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fine{font-size:12px;line-height:17px;color:var(--pizarra);text-align:center;margin:16px 6px 0}
.fine a{color:var(--pizarra)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.confetti{display:none}.progress>div{transition:none}}
/* ═══════ TEMA OSCURO ═══════ */
body{background:#141831 radial-gradient(ellipse 900px 600px at 50% 18%, rgba(201,168,76,.13), rgba(20,24,49,0) 70%) no-repeat fixed;color:var(--perg)}
header img{background:var(--perg);padding:10px 16px;border-radius:16px;box-sizing:content-box}
.back{color:#D8D3C4}
.progress{background:rgba(242,235,217,.14)}
.hero{background:var(--noche2);border:1px solid rgba(201,168,76,.28)}
.gift{background:rgba(201,168,76,.08);border-color:rgba(201,168,76,.6)}
.gift .gi{background:var(--bronce);color:var(--noche)}
.gift b{color:var(--perg)} .gift span{color:#D8D3C4}
h2{color:var(--perg)}
.lead,.help{color:#C9C3B1}
.tag{background:var(--bronce);color:var(--noche)}
.tag.serio{background:var(--vino);color:#fff}
.opt{background:rgba(255,255,255,.045);border-color:rgba(242,235,217,.16);color:var(--perg)}
.opt:hover{border-color:var(--bronce);background:rgba(255,255,255,.07)}
.opt[aria-pressed=true]{background:rgba(201,168,76,.16);border-color:var(--bronce)}
.opt .em{background:rgba(255,255,255,.08)}
.opt .sub{color:#BFB9A8}
.opt .chk{border-color:rgba(242,235,217,.35)}
.opt[aria-pressed=true] .chk{background:var(--bronce);border-color:var(--bronce)}
.field label{color:#D8D3C4}
.field input{background:rgba(255,255,255,.06);border-color:rgba(242,235,217,.2);color:var(--perg)}
.field input::placeholder{color:#8F8A7C}
.inter .big{color:var(--perg)}
.btn.main{background:var(--bronce);color:var(--noche)}.btn.main:hover{background:#D6B65A}
.btn.ghost{border-color:rgba(242,235,217,.3);color:var(--perg)}
.btn.link{color:#C9C3B1}
.meter{background:var(--noche2);border:1px solid rgba(201,168,76,.28)}
.card,.historia,.sorteo{background:var(--noche2);border:1px solid rgba(242,235,217,.12)}
.card h3,.historia p,.sorteo h3{color:var(--perg)}
.card p,.historia p.small{color:#C9C3B1}
.historia .eyebrow,.card .eyebrow,.sorteo .eyebrow{color:var(--bronce)}
.historia .vuelta{color:var(--bronce)}
.points li{color:var(--perg)} .points li svg{color:#7BC59B}
.pill.ok{background:rgba(123,197,155,.16);color:#9BD8B4}
.pill.mid{background:rgba(201,168,76,.18);color:#E6CC80}
.pill.info{background:rgba(242,235,217,.12);color:var(--perg)}
.words span{background:rgba(255,255,255,.06);border-color:rgba(242,235,217,.16);color:var(--perg)}
.words span b{color:var(--bronce)}
.prize{background:linear-gradient(135deg,#2A2F55,#1F2444);border:1.5px solid var(--bronce)}
.sorteo{border-color:rgba(201,168,76,.45)}
.steps li{color:var(--perg)} .steps li::before{background:var(--bronce);color:var(--noche)}
.fine{color:#9E9989} .fine a{color:#C9C3B1}
.cond{margin:10px 0 0;font-size:13px;line-height:19px;color:#C9C3B1}
.ctaBox{background:var(--noche2);border:1px solid rgba(242,235,217,.12);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:10px}
.ctaBox p{margin:0;font-size:15px;line-height:21px;color:#D8D3C4;text-align:center}
.ctaBox p b{color:var(--bronce)}
.btn.call{background:transparent;border:1.5px solid var(--bronce);color:var(--bronce);min-height:50px;font-size:16px}

</style>

  'Piamonte':'Los piamonteses llenaron de colonias la pampa gringa de Santa Fe y Córdoba.',

  'Lombardía':'De Lombardía llegaron trabajadores y artesanos que ayudaron a construir nuestras ciudades.',
};
const DEL = {'Piamonte':'del Piamonte','Véneto':'del Véneto','Abruzzo':'del Abruzzo','Friuli':'del Friuli','Las Marcas':'de Las Marcas'};
const deReg = r => DEL[r] || 'de '+r;
const RAIZ_GEN = r => { const d = deReg(r); return d.charAt(0).toUpperCase()+d.slice(1)+' llegaron miles de familias con una valija y muchas ganas de empezar de cero.'; };
function nombreLimpio(t){
  t = String(t||'').replace(/[^\p{L}\s'.-]/gu,'').replace(/\s+/g,' ').trim().slice(0,22);
  return t ? t.charAt(0).toLocaleUpperCase('es')+t.slice(1) : '';
}
const regionTxt = () => (r.region && r.region!=='otra' && r.region!=='nose') ? r.region : '';

let r = {}, hist = [], codigo = '';

function siguiente(){
  for(const k of FUN) if(r[k]===undefined) return k;
  if(!r.region) return 'region';
  if(r.nombre===undefined) return 'NOMBRE';
  if(!r._inter) return 'INTER';
  if(!r.estado) return 'estado';
  if(r.estado==='si') return r.servicios ? 'RES' : 'servicios';
  if(r.estado==='tramite') return 'RES';
  if(!r.familiar) return 'familiar';
  if((r.familiar==='padre'||r.familiar==='abuelo') && !r.solo) return 'solo';
  if(r.familiar==='bisabuelo' && !r.residencia) return 'residencia';
  if(!r.datos) return 'datos';
  return 'RES';
}
function tipoResultado(){
  if(r.estado==='si') return 'servicios';
  if(r.estado==='tramite') return 'tramite';
  if((r.familiar==='padre'||r.familiar==='abuelo') && r.solo==='solo') return 'ok';
  if(r.familiar==='bisabuelo' && r.residencia==='si') return 'ok';
  if(r.familiar==='bisabuelo' && r.residencia==='no') return 'lejano';
  if(r.solo==='natur') return 'natur';
  return 'revisar';
}
function porcentaje(){
  const pts = ['domingo','hablar','apellido'].reduce((a,k)=>a+(r[k]||0),0);   // 0..9
  const pal = (r.palabras||[]).length;                                       // 0..8
  let p = 48 + pts*3 + pal*2 + (regionTxt()?3:0);                            // 48..94
  p += ({padre:9, abuelo:7, bisabuelo:3}[r.familiar]||0) + (r.estado==='si'?9:0) + (r.estado==='tramite'?6:0);
  p += (codigo.charCodeAt(5)||0)%4;                          // un poquito de variación
  return Math.max(41, Math.min(99, p));
}
function titulo(p){
  if(p>=90) return ['Tano de','pura cepa','En tu casa el tuco es religión y los domingos son sagrados.'];
  if(p>=75) return ['Tano de','domingo','Se te nota la nonna en cada gesto. Sos más tano de lo que creés.'];
  if(p>=60) return ['Tano','adoptivo','No tendrás el apellido, pero el corazón ya lo tenés.'];
  return ['Tano en','potencia','Todavía no, pero con un plato de ravioles se arregla todo.'];
}

    <p class="fine">El resultado de ciudadanía es orientativo según la Ley 74/2025, confirmada por la Corte Constitucional italiana en 2026, y no reemplaza el análisis de tu caso. ${bases}. Este sorteo no está patrocinado ni administrado por Instagram.</p>`);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const a=$('arc'); if(a) a.style.strokeDashoffset = String(100-p); }));
  contar($('num'), p);
  if(p>=60) confetti();
  $('again').onclick = intro;
  $('story').onclick = () => historia(p, t1, t2);
  $('share').onclick = compartir;
}

function vueltaTxt(){
  const t = tipoResultado();
  return ({ servicios:'Y vos ya hiciste el viaje de vuelta.',
            tramite:'Y vos ya estás haciendo el viaje de vuelta.',
            ok:'Hoy, vos podés hacer el viaje de vuelta.',
            revisar:'Veamos juntos si podés hacer el viaje de vuelta.',
            natur:'Veamos juntos si podés hacer el viaje de vuelta.',
            lejano:'Si la ley cambia, vas a ser de los primeros en saberlo.' })[t];
}
function historiaHTML(){
  const reg = regionTxt(), quien = r.nombre || 'Alguien de tu familia';
  const linea = reg ? (RAICES[reg] || RAIZ_GEN(reg)) : 'Si todavía no sabés de qué pueblo era, lo encontramos: buscamos actas en toda Italia.';
  const pal = r.palabras||[];
  const ORIG = {laburo:'lavoro', chau:'ciao', fiaca:'fiacca', facha:'faccia', manyar:'mangiare', birra:'birra', yeta:'iettatura', capo:'capo'};
  return `
    <section class="historia" style="margin-top:14px" aria-label="Tu historia">
      <div class="eyebrow">Tu historia</div>
      <p>${esc(quien)} salió ${esc(reg?deReg(reg):'de Italia')} y cruzó el océano en barco, durante semanas, para empezar de cero en la Argentina.</p>
      <p class="small">${esc(linea)}</p>
      <div class="vuelta">${vueltaTxt()}</div>
    </section>
    ${pal.length?`<section class="card" style="margin-top:14px">
      <div class="eyebrow">¿Sabías que…?</div>
      <h3>Hablás italiano todos los días</h3>
      <p>Las palabras que marcaste llegaron en esos barcos:</p>
      <div class="words">${pal.map(w=>`<span>${esc(w)} ← <b>${esc(ORIG[w]||w)}</b></span>`).join('')}</div>
    </section>`:''}`;
}

function contar(el, to){
  const t0 = performance.now(), d = 1600;
  const step = now => { const k = Math.min(1,(now-t0)/d); el.textContent = Math.round(to*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); };
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = to; return; }
  requestAnimationFrame(step);
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('div'); c.className='confetti';
  const cols=['#1F7A4A','#FFFFFF','#8B1A1A','#C9A84C'];
  for(let i=0;i<70;i++){ const s=document.createElement('i'); s.style.left=Math.random()*100+'%'; s.style.background=cols[i%4];
    s.style.animationDelay=(Math.random()*.6)+'s'; s.style.animationDuration=(2+Math.random()*1.4)+'s'; s.style.boxShadow='0 0 0 1px rgba(0,0,0,.05)'; c.appendChild(s); }
  document.body.appendChild(c); setTimeout(()=>c.remove(), 4200);
}

async function compartir(){
  const url = location.origin + location.pathname + (FUENTE?'?src=amigo':'');
  const data = {title:'El Tanómetro de Zittano', text:'Jugué al Tanómetro 🇮🇹 ¿A que no te da más que a mí? Fijate también si te corresponde la ciudadanía italiana:', url};
  try{
    if(navigator.share){ await navigator.share(data); return; }
    await navigator.clipboard.writeText(data.text+' '+url);
    $('share').textContent = '¡Link copiado!';
  }catch(e){}
}

/* ═══════════════ IMAGEN PARA HISTORIAS (1080×1920) ═══════════════ */
async function historia(p, t1, t2){
  const btn = $('story'); btn.disabled = true;
  try{
    await document.fonts.ready;
    const W=1080, H=1920, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const x=cv.getContext('2d');
    // fondo
    x.fillStyle='#1A1F3A'; x.fillRect(0,0,W,H);
    const g=x.createRadialGradient(W/2,760,60,W/2,760,900); g.addColorStop(0,'rgba(201,168,76,.22)'); g.addColorStop(1,'rgba(26,31,58,0)');
    x.fillStyle=g; x.fillRect(0,0,W,H);
    // tricolor
    [['#1F7A4A',0],['#FFFFFF',1],['#8B1A1A',2]].forEach(([c,i])=>{x.fillStyle=c; x.fillRect(i*W/3,0,W/3,16);});
    // círculos decorativos
    x.strokeStyle='rgba(201,168,76,.28)'; x.lineWidth=2; [[960,170,180],[960,170,120]].forEach(([cx,cy,rr])=>{x.beginPath();x.arc(cx,cy,rr,0,Math.PI*2);x.stroke();});
    // logo sobre placa pergamino
    const logo = await cargarImg($('logo').src);
    x.fillStyle='#F2EBD9'; redondeado(x, W/2-190, 130, 380, 230, 34); x.fill();
    const lw=300, lh=lw*logo.height/logo.width; x.drawImage(logo, W/2-lw/2, 130+(230-lh)/2, lw, lh);
    // título
    x.textAlign='center'; x.fillStyle='#C9A84C'; x.font='700 34px Inter, sans-serif';
    letterSpacing(x,'MI TANÓMETRO', W/2, 470, 8);
    // dial
    const cx=W/2, cy=980, R=330;
    x.lineCap='round'; x.lineWidth=46; x.strokeStyle='rgba(242,235,217,.14)';
    x.beginPath(); x.arc(cx,cy,R,Math.PI,0); x.stroke();
    const gr=x.createLinearGradient(cx-R,0,cx+R,0); gr.addColorStop(0,'#1F7A4A'); gr.addColorStop(.5,'#F2EBD9'); gr.addColorStop(1,'#B0302F');
    x.strokeStyle=gr; x.beginPath(); x.arc(cx,cy,R,Math.PI,Math.PI+Math.PI*p/100); x.stroke();
    // número
    x.fillStyle='#F2EBD9'; x.font='800 230px "Playfair Display", Georgia, serif'; x.fillText(String(p), cx-40, cy+10);
    x.fillStyle='#C9A84C'; x.font='800 110px "Playfair Display", Georgia, serif';
    const nw = (x.font='800 230px "Playfair Display", Georgia, serif', x.measureText(String(p)).width);
    x.font='800 110px "Playfair Display", Georgia, serif'; x.textAlign='left'; x.fillText('%', cx-40+nw/2+8, cy-60); x.textAlign='center';
    // categoría
    x.fillStyle='#F2EBD9'; x.font='800 92px "Playfair Display", Georgia, serif'; x.fillText(t1, cx, 1170);
    x.fillStyle='#C9A84C'; x.font='italic 600 100px "Playfair Display", Georgia, serif'; x.fillText(t2, cx, 1282);
    // raíces
    const reg = regionTxt();
    if(reg || r.nombre){
      x.fillStyle='#F2EBD9'; x.font='500 44px Inter, sans-serif';
      x.fillText(reg ? 'Mis raíces: '+reg : 'Mis raíces: Italia', cx, 1380);
      if(r.nombre){ x.fillStyle='#C9A84C'; x.font='italic 600 50px "Playfair Display", Georgia, serif'; x.fillText('En honor a '+r.nombre, cx, 1446); }
    }
    // separador
    const sy = r.nombre ? 1505 : (reg ? 1450 : 1410);
    x.strokeStyle='rgba(201,168,76,.6)'; x.lineWidth=2; x.beginPath(); x.moveTo(250,sy); x.lineTo(500,sy); x.moveTo(580,sy); x.lineTo(830,sy); x.stroke();
    x.fillStyle='#C9A84C'; x.save(); x.translate(cx,sy); x.rotate(Math.PI/4); x.fillRect(-11,-11,22,22); x.restore();
    // desafío
    x.fillStyle='#F2EBD9'; x.font='600 54px Inter, sans-serif'; x.fillText('¿Y vos, qué tan tano sos?', cx, sy+100);
    x.fillStyle='#BFB9A8'; x.font='500 40px Inter, sans-serif'; x.fillText('Jugá y descubrí tus raíces italianas', cx, sy+160);
    // link
    x.fillStyle='#C9A84C'; redondeado(x, cx-330, 1705, 660, 110, 55); x.fill();
    x.fillStyle='#1A1F3A'; x.font='700 46px Inter, sans-serif'; x.fillText(CFG.linkTest, cx, 1777);
    x.fillStyle='#BFB9A8'; x.font='500 34px Inter, sans-serif'; x.fillText(CFG.instagram, cx, 1870);

    const blob = await new Promise(res=>cv.toBlob(res,'image/png'));
    const file = new File([blob], 'mi-tanometro.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'Mi Tanómetro', text:'¿Y vos, qué tan tano sos? '+CFG.instagram}); return; }catch(e){ if(e && e.name==='AbortError') return; }
    }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='mi-tanometro.png'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  } finally { btn.disabled = false; }
}
function cargarImg(src){ return new Promise((ok,ko)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=ko; im.src=src; }); }
function redondeado(x,X,Y,w,h,rr){ x.beginPath(); x.moveTo(X+rr,Y); x.arcTo(X+w,Y,X+w,Y+h,rr); x.arcTo(X+w,Y+h,X,Y+h,rr); x.arcTo(X,Y+h,X,Y,rr); x.arcTo(X,Y,X+w,Y,rr); x.closePath(); }
function letterSpacing(x, txt, cx, y, sp){
  const chars=[...txt], ws=chars.map(c=>x.measureText(c).width), total=ws.reduce((a,b)=>a+b,0)+sp*(chars.length-1);
  let px=cx-total/2; x.textAlign='left'; chars.forEach((c,i)=>{ x.fillText(c,px,y); px+=ws[i]+sp; }); x.textAlign='center';
}

/* ═══════════════ VOLVER ═══════════════ */
$('back').onclick = () => {
  const prev = hist.pop();
  if(!prev || prev==='intro'){ intro(); return; }
  if(prev==='_inter'){ delete r._inter; interludio(); return; }
  if(prev==='nombre'){ delete r.nombre; delete r._inter; pantallaNombre(); return; }
  const orden=['domingo','hablar','apellido','palabras','region','nombre','_inter','estado','servicios','familiar','solo','residencia','datos'];
  orden.slice(orden.indexOf(prev)).forEach(k=>{ if(!hist.includes(k)) delete r[k]; });
  pregunta(prev);
};

intro();
</script>
